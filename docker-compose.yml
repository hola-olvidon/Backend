services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hola-olvidon-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/hola_olvidon?schema=public
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
      - S3_BUCKET=alarms
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - hola-network

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: hola-olvidon-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hola_olvidon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hola-network

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: hola-olvidon-storage
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - ROOT_USER=rustfsadmin
      - ROOT_PASSWORD=rustfsadmin
    volumes:
      - rustfs_data:/data
    networks:
      - hola-network

networks:
  hola-network:
    driver: bridge

volumes:
  postgres_data:
  rustfs_data:
